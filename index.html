<style>

.seg{grid-template-columns:repeat(3,1fr)}

<body>
<div class="app">
  <header>
    <div class="brand"><span id="logo"></span>Pay Links</div>
    <span class="pill" id="mode">Preview</span>
  </header>
  <main id="view" aria-live="polite"></main>
</div>
<nav class="tabs" aria-label="Main">
  <button type="button" data-tab="pay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>Pay</button>
  <button type="button" data-tab="receive"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 7 7 17M16 17H7V8"/></svg>Receive</button>
</nav>

<script>
(() => {
'use strict';

/* ---------- config ---------- */
const LUNA = 100000;                                   // 1 NIM = 100,000 Luna
const DEMO_ADDR = 'NQ07 0000 0000 0000 0000 0000 0000 0000 0000';
const APP_URL = /^https?:/.test(location.protocol) ? location.origin + location.pathname : 'https://your-app.example/';
const GET_PAY_URL = 'https://nimpay.app';              // where non-users go to get Nimiq Pay
const PRESETS = [10, 50, 100, 500, 1000];
const TYPES = {
  person: { label: 'Tip jar', blurb: 'Tips and support for someone', ph: 'Mara, docs translator' },
  request: { label: 'Request', blurb: 'Ask for an exact amount and reason', ph: 'Meetup venue share' },
  bounty: { label: 'Bounty', blurb: 'One job, one payout', ph: 'Fix the forum FAQ' },
  pot:    { label: 'Group tip', blurb: 'Many people chip in', ph: 'Meetup venue fund' },
};

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const short = a => a.slice(0, 9) + '…' + a.slice(-4);
const fmt = n => Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 });

// Nimiq addresses use the IBAN-style mod-97 checksum.
function validAddress(raw) {
  const a = String(raw).replace(/\s+/g, '').toUpperCase();
  if (!/^NQ\d{2}[0-9A-Z]{32}$/.test(a)) return null;
  let rem = 0;
  for (const ch of a.slice(4) + a.slice(0, 4)) {
    const v = /\d/.test(ch) ? ch : String(ch.charCodeAt(0) - 55);
    for (const d of v) rem = (rem * 10 + Number(d)) % 97;
  }
  return rem === 1 ? a.replace(/(.{4})/g, '$1 ').trim() : null;
}
const enc = o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const KINDS = ['person', 'bounty', 'pot', 'request'];
const dec = s => { try {
  s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
  const o = JSON.parse(decodeURIComponent(escape(atob(s))));
  if (!Array.isArray(o)) return o;   // older long links still work
  const q = { v: 1, t: KINDS[o[0]] || 'person', n: o[1], a: validAddress(o[2]) || o[2] };
  if (o[3]) q.d = o[3]; if (o[4] > 0) q.g = o[4]; if (o[5] && o[5].length) q.s = o[5];
  if (o[6]) q.h = 1;
  if (o[7]) q.m = o[7];
  return q;
} catch { return null; } };
const parseAmounts = str => [...new Set(String(str).split(/[,\s]+/).map(Number).filter(n => n > 0 && isFinite(n)))].slice(0, 4);
const byteLen = s => new TextEncoder().encode(s).length;
const fullMsg = () => [payload && payload.m, ps.priv ? '' : ps.msg.trim()].filter(Boolean).join(' · ');

let toastTimer;
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 1800);
}
async function copy(text, msg = 'Copied') {
  try { await navigator.clipboard.writeText(text); toast(msg); }
  catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast(msg); } catch { toast('Copy failed'); } ta.remove(); }
}
async function share(title, text, url) {
  if (navigator.share) { try { await navigator.share({ title, text, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  copy(url, 'Link copied');
}

async function saveImage(canvas, name) {
  const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
  if (!blob) return toast('Could not make the image');
  const f = new File([blob], name, { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [f] })) { try { await navigator.share({ files: [f], title: name }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function makeCard(p, amt) {
  const c = document.createElement('canvas'); c.width = c.height = 1080; const x = c.getContext('2d');
  const F = w => w + ' px Mulish,system-ui,sans-serif';
  x.fillStyle = '#1F2348'; x.fillRect(0, 0, 1080, 1080);
  x.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i - Math.PI / 2; x[i ? 'lineTo' : 'moveTo'](540 + 180 * Math.cos(a), 330 + 180 * Math.sin(a)); } x.closePath();
  x.fillStyle = x.strokeStyle = '#F6B221'; x.lineJoin = 'round'; x.lineWidth = 24; x.fill(); x.stroke();
  x.strokeStyle = '#1F2348'; x.lineWidth = 27; for (const dx of [-43, 43]) { x.beginPath(); x.arc(540 + dx, 330, 58, 0, 7); x.stroke(); }
  x.textAlign = 'center'; x.fillStyle = '#fff'; x.font = F('800 72'); x.fillText(p.t === 'request' ? 'I paid' : 'I tipped', 540, 640);
  x.fillStyle = '#F6B221'; x.font = F('800 120'); x.fillText(fmt(amt) + ' NIM', 540, 780);
  x.fillStyle = '#fff'; x.font = F('700 64'); x.fillText('to ' + (p.n.length > 26 ? p.n.slice(0, 25) + '…' : p.n), 540, 880);
  x.fillStyle = '#A6ACD3'; x.font = F('700 40'); x.fillText('Pay Links · Nimiq Pay', 540, 1000);
  return c;
}

/* ---------- hexagon avatar (Nimiq is hexagonal) ---------- */
let hexId = 0;
function hex(seed, size = 72) {
  let h = 7; for (const c of seed) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const h1 = h % 360, h2 = (h1 + 50 + (h >> 9) % 90) % 360, id = 'g' + (++hexId);
  const pts = (r, rot = 0) => [0,1,2,3,4,5].map(i => { const a = Math.PI / 3 * i - Math.PI / 2 + rot; return (50 + r * Math.cos(a)).toFixed(1) + ',' + (50 + r * Math.sin(a)).toFixed(1); }).join(' ');
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h1} 85% 58%)"/><stop offset="1" stop-color="hsl(${h2} 80% 48%)"/></linearGradient></defs>
    <polygon points="${pts(46)}" fill="url(#${id})" stroke-linejoin="round" stroke="url(#${id})" stroke-width="6"/>
    <polygon points="${pts(30, Math.PI / 6)}" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="3"/>
    <polygon points="${pts(13)}" fill="#fff" fill-opacity=".92"/></svg>`;
}
$('#logo').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="26" height="26" aria-hidden="true"><polygon points="50,4 89.8,27 89.8,73 50,96 10.2,73 10.2,27" fill="#F6B221" stroke="#F6B221" stroke-width="6" stroke-linejoin="round"/><circle cx="39" cy="50" r="15" fill="none" stroke="#1F2348" stroke-width="7"/><circle cx="61" cy="50" r="15" fill="none" stroke="#1F2348" stroke-width="7"/></svg>`;

/* ---------- wallet layer: Nimiq Pay provider, with a preview fallback ---------- */
const Wallet = {
  nimiq: null, live: false,
  async init() {
    try {
      const sdk = await import('https://esm.sh/@nimiq/mini-app-sdk');
      this.nimiq = await Promise.race([sdk.init(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 6000))]);
      this.live = true;
    } catch {
      // Fallback: use the provider Nimiq Pay injects directly, if the SDK could not load.
      for (let i = 0; i < 30 && !window.nimiq; i++) await sleep(200);
      if (window.nimiq) { this.nimiq = window.nimiq; this.live = true; }
    }
    const net = window.nimiqPay && window.nimiqPay.network;   // 'mainnet' | 'testnet' (newer Nimiq Pay only)
    const m = $('#mode');
    m.textContent = this.live ? (net === 'testnet' ? 'Nimiq Pay · Testnet' : 'Nimiq Pay') : 'Preview';
    m.classList.toggle('live', this.live);
    return this.live;
  },
  unwrap(r) {   // the raw provider may return { error } instead of throwing
    if (r && typeof r === 'object' && r.error) throw Object.assign(new Error(r.error.message || 'Wallet error'), { type: r.error.type });
    return r;
  },
  async account() {
    if (!this.live) throw Object.assign(new Error('Open Pay Links inside Nimiq Pay to use your address.'), { type: 'NOT_IN_WALLET' });
    const [a] = this.unwrap(await this.nimiq.listAccounts()); return a;
  },
  async accounts() {
    if (!this.live) return [];
    return this.unwrap(await this.nimiq.listAccounts());
  },
  async balanceNim(addr) {
    if (this.live && typeof this.nimiq.getBalance === 'function') return this.unwrap(await this.nimiq.getBalance(addr)) / LUNA;
    return null;
  },
  async pay(recipient, nim, msg) {
    const value = Math.round(nim * LUNA);
    if (!this.live) throw Object.assign(new Error('Open Pay Links inside Nimiq Pay to pay.'), { type: 'NOT_IN_WALLET' });
    return this.unwrap(msg ? await this.nimiq.sendBasicTransactionWithData({ recipient, value, data: msg })
                           : await this.nimiq.sendBasicTransaction({ recipient, value }));
  },
};
function explain(e) {
  const t = e && e.type;
  if (t === 'NOT_IN_WALLET' || t === 'SELF' || t === 'LOCAL') return e.message;
  if (t === 'PERMISSION_DENIED') return 'Payment cancelled. Nothing was sent.';
  if (t === 'NETWORK_ERROR') return 'The network did not confirm the submission. Check your Nimiq Pay history before paying again.';
  if (t === 'INVALID_TRANSACTION' || t === 'INVALID_REQUEST') return 'Nimiq Pay rejected this payment: ' + ((e && e.message) || 'check the amount and address') + '.';
  return 'Payment failed: ' + ((e && e.message) || 'unknown error') + '.';
}

/* ---------- state ---------- */
let payload = null, preview = false;
let form = { t: 'person', n: '', d: '', a: '', g: '', s: [10, 50, 100], c: '', h: false, r: '', m: '' };
let ps = { amount: null, msg: '', priv: false, busy: false, done: null, error: '' };
let demoRaised = 0, raised = null;

const linkFor = p => APP_URL + '?d=' + enc([Math.max(0, KINDS.indexOf(p.t)), p.n, p.a.replace(/\s/g, ''), p.d || '', p.g || 0, p.s || [], p.h ? 1 : 0, p.m || '']);
const payUrlFor = p => 'https://nimpay.app/miniapps/open/' + linkFor(p).replace(/^https?:\/\//, '');

function build() {
  const n = form.n.trim();
  if (!n) return { err: 'Name this link to see it here.' };
  const a = validAddress(form.a);
  if (!a) return { err: form.a.trim() ? 'That is not a valid Nimiq address. Check it and try again.' : 'Add the Nimiq address that receives the money.' };
  const cu = Number(String(form.c).replace(',', '.')), g = Number(form.g);
  const s = [...new Set([...form.s, ...(cu > 0 && isFinite(cu) ? [cu] : [])])].sort((x, y) => x - y).slice(0, 4);
  const p = { v: 1, t: form.t, n, a };
  if (form.d.trim()) p.d = form.d.trim();
  if (form.t === 'request') { const ar = Number(String(form.r).replace(',', '.')); if (!(ar > 0)) return { err: 'Enter the amount to request.' }; p.s = [ar]; const m = form.m.trim().slice(0, 24); if (m) p.m = m; }
  else p.s = s.length ? s : [10, 50, 100];
  if (form.h) p.h = 1;
  return { p };
}

/* ---------- create view ---------- */
function renderCreate() {
  const T = TYPES[form.t];
  $('#view').innerHTML = `
    <h1>Get paid in Nimiq with one link</h1>
    <p class="lead">Tips or exact requests. The link opens ready to pay inside Nimiq Pay.</p>
    <section class="card">
      <div class="lbl">What is it for?</div>
      <div class="seg" role="group" aria-label="Link type">
        ${Object.entries(TYPES).filter(([k]) => k !== 'bounty').map(([k, v]) => `<button type="button" data-t="${k}" aria-pressed="${k === form.t}">${v.label}</button>`).join('')}
      </div>
      <p class="hint">${T.blurb}.</p>
      <label for="n">Name</label>
      <input id="n" data-k="n" maxlength="60" placeholder="${esc(T.ph)}" value="${esc(form.n)}" autocomplete="off">
      <label for="d">What the money is for <span class="hint">(optional)</span></label>
      <textarea id="d" data-k="d" maxlength="200" placeholder="A sentence people will read before they pay">${esc(form.d)}</textarea>
      <label for="a">Nimiq address that gets paid</label>
      <div class="row">
        <input id="a" data-k="a" placeholder="NQ.. .... ...." value="${esc(form.a)}" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button type="button" class="btn btn-ghost btn-sm" id="mine">Use mine</button>
      </div>
      <label class="chk"><input type="checkbox" id="hd" ${form.h ? 'checked' : ''}>Hide my address until tapped</label>
      <p class="hint">Nimiq payments are public. Use a fresh address for each link.</p>
      ${form.t === 'request' ? `
      <label for="r">Amount to request in NIM</label>
      <input id="r" data-k="r" inputmode="decimal" placeholder="e.g. 25" value="${esc(form.r)}">
      <label for="m">Reference <span class="hint">(optional, goes on the payment)</span></label>
      <input id="m" data-k="m" maxlength="24" placeholder="e.g. meetup-oct" value="${esc(form.m)}">` : `
      <div class="lbl">Quick amounts in NIM</div>
      <div class="chips" id="qa">${PRESETS.map(a => `<button type="button" class="chip" data-q="${a}" aria-pressed="${form.s.includes(a)}">${fmt(a)}</button>`).join('')}</div>
      <label for="c">Custom amount <span class="hint">(optional)</span></label>
      <input id="c" data-k="c" inputmode="decimal" placeholder="e.g. 250" value="${esc(form.c)}">
      <p class="hint">These become one-tap buttons on your page, up to four. Payers can still type any amount.</p>`}
    </section>
    <section class="card" id="out"></section>
    <section class="card" id="mine-list" hidden></section>
    <section class="card">
      <label for="pl">Have a link or address to pay?</label>
      <div class="row"><input id="pl" placeholder="Paste here" autocomplete="off" autocapitalize="none" spellcheck="false"><button type="button" class="btn btn-ghost btn-sm" id="pg">Pay</button></div>
      <p class="err" id="pe" role="alert" hidden></p>
    </section>
    <p class="foot">Everything lives inside the link. No account, no server, nothing stored. Payments go straight from the payer's wallet to your address.</p>`;

  $('#view').querySelectorAll('[data-t]').forEach(b => b.onclick = () => { form.t = b.dataset.t; renderCreate(); });
  $('#view').querySelectorAll('[data-k]').forEach(i => i.oninput = () => { form[i.dataset.k] = i.value; updateOut(); });
  $('#view').querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
    const a = Number(b.dataset.q), on = form.s.includes(a);
    if (!on && form.s.length + (Number(form.c) > 0 ? 1 : 0) >= 4) { toast('Up to four amounts'); return; }
    form.s = on ? form.s.filter(x => x !== a) : [...form.s, a];
    b.setAttribute('aria-pressed', String(!on)); updateOut();
  });
  $('#pg').onclick = payFromInput;
  $('#hd').onchange = e => { form.h = e.target.checked; updateOut(); };
  $('#mine').onclick = async () => {
    try { form.a = await Wallet.account(); $('#a').value = form.a; updateOut(); }
    catch (e) { toast(explain(e).replace('Payment ', 'Request ')); }
  };
  updateOut(); paintMine();
}

let qrLib;
function loadQR() {
  return qrLib || (qrLib = new Promise(res => {
    if (window.QRCode) return res(true);
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    s.onload = () => res(true); s.onerror = () => res(false); document.head.appendChild(s);
  }));
}

function updateOut() {
  const out = $('#out'); if (!out) return;
  const r = build();
  if (r.err) { out.innerHTML = `<h2>Your link</h2><p class="hint" style="margin:0">${esc(r.err)}</p>`; return; }
  const web = linkFor(r.p), url = payUrlFor(r.p);
  out.innerHTML = `
    <h2>Your link is ready</h2>
    <p class="hint" style="margin:0 0 12px">This link opens straight in Nimiq Pay. Post it in the forum, Skool, Telegram or X.</p>
    <div class="linkbox" id="lb">${esc(url)}</div>
    <div class="stack">
      <button class="btn btn-gold" id="cp">Copy link</button>
      <button class="btn btn-ghost" id="sh">Share</button>
      <button class="btn btn-ghost" id="cw">Copy browser link</button>
      <button class="btn btn-ghost" id="sq">Save QR image</button>
    </div>
    <div class="qr" id="qr" aria-label="QR code for this link"></div>`;
  $('#sq').onclick = () => { const cv = $('#qr canvas'); cv ? saveImage(cv, 'pay-links-qr.png') : toast('QR is not ready yet'); };
  $('#cw').onclick = () => copy(web, 'Browser link copied');
  $('#cp').onclick = () => { saveLink(r.p, url); copy(url, 'Link copied'); };
  $('#sh').onclick = () => saveLink(r.p, url) || share(r.p.n, `Pay ${r.p.n} with Nimiq Pay`, url);
  loadQR().then(ok => {
    const box = $('#qr'); if (!ok || !box || !window.QRCode) return;
    box.innerHTML = '<div></div>';
    try { new QRCode(box.firstChild, { text: url, width: 240, height: 240, colorDark: '#1F2348', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); } catch { box.innerHTML = ''; }
  });
}

/* ---------- pay view ---------- */
function resetPay() { ps = { amount: payload.s && payload.s[0] || null, msg: '', priv: false, busy: false, done: null, error: '' }; raised = null; loadRaised(); }

async function loadRaised() {
  if (!payload || !payload.g) return;
  try { raised = Wallet.live ? await Wallet.balanceNim(payload.a) : null; } catch { raised = null; }
  paintProgress();
}
function paintProgress() {
  const el = $('#prog'); if (!el || !payload.g) return;
  if (raised == null) { el.innerHTML = `<div class="meta"><span>Goal ${fmt(payload.g)} NIM</span></div>`; return; }
  const pct = Math.min(100, raised / payload.g * 100);
  el.innerHTML = `<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><i style="width:${pct}%"></i></div>
    <div class="meta"><span>${fmt(raised)} NIM ${payload.t === 'bounty' ? 'funded' : 'raised'}</span><span>of ${fmt(payload.g)}</span></div>`;
}

function renderPay() {
  const p = payload, T = TYPES[p.t] || TYPES.person;
  const amounts = p.s || [];
  const body = ps.done ? `
    <div class="done">
      <div class="pop" style="display:inline-block">${hex(p.a, 84)}</div>
      <h2>Tip submitted: ${fmt(ps.done.amt)} NIM</h2>
      <p class="hint" style="margin:4px 0 0">To ${esc(p.n)}. It confirms in a few seconds; check Nimiq Pay for the final status.</p>
      <div class="hash">${esc(ps.done.hash)}</div>
    </div>
    <div class="stack">
      <button class="btn btn-gold" id="again">Share this page</button>
      <button class="btn btn-ghost" id="card">Share thank-you card</button>
      <button class="btn btn-ghost" id="mk">Make my own pay link</button>
    </div>` : `
    ${p.t === 'request' ? `<div class="lbl">Amount</div><div class="reqamt">${fmt(amounts[0])} NIM</div>${p.m ? `<p class="hint">Reference: ${esc(p.m)}</p>` : ''}` : `    ${amounts.length ? `<div class="lbl">Amount in NIM</div><div class="chips" id="chips">${amounts.map(a => `<button type="button" class="chip" data-a="${a}" aria-pressed="${ps.amount === a}">${fmt(a)}</button>`).join('')}</div>` : ''}
    <label for="amt">${amounts.length ? 'Or enter another amount' : 'Amount in NIM'}</label>
    <input id="amt" inputmode="decimal" placeholder="0" value="${ps.amount && !amounts.includes(ps.amount) ? ps.amount : ''}">`}
    <label for="msg">Public message <span class="hint">(optional)</span></label>
    <input id="msg" maxlength="64" placeholder="Thanks for the help" value="${esc(ps.msg)}" ${ps.priv ? 'disabled' : ''}>
    <p class="hint" id="mh">Written on the blockchain, so anyone can read it.</p>
    <label class="chk"><input type="checkbox" id="pv2" ${ps.priv ? 'checked' : ''}>Tip privately, no message</label>
    <p class="hint">No message is sent, but your wallet address stays visible on the blockchain.</p>
    ${ps.error ? `<p class="err" role="alert">${esc(ps.error)}</p>` : ''}
    <div class="stack"><button class="btn btn-gold" id="go"></button></div>`;

  $('#view').innerHTML = `
    <button class="back" id="bk">Pay someone else</button>
    ${!Wallet.live ? `<section class="card"><h2>Pay with Nimiq Pay</h2><p class="hint" style="margin:0 0 12px">Pay Links lets you pay or tip anyone in the Nimiq community with one link. You need Nimiq Pay to pay.</p><a class="btn btn-gold" href="${esc(payUrlFor(p))}">Open in Nimiq Pay</a><div class="stack"><a class="btn btn-ghost" href="${GET_PAY_URL}">Get Nimiq Pay</a></div></section>` : ''}
    <section class="card">
      <div class="hero">${hex(p.a)}<div><span class="tag">${esc(T.label)}</span><h1>${esc(p.n)}</h1></div></div>
      ${p.d ? `<p style="margin:14px 0 0">${esc(p.d)}</p>` : ''}
      <div id="prog">${p.g ? '' : ''}</div>
      <div class="addr">${p.h ? '<button class="back" id="sa">Show address</button>' : `Pays to ${esc(short(p.a.replace(/\s/g, '')))} <button class="back" id="ca">Copy</button>`}</div>
    </section>
    <section class="card">${body}</section>
    <p class="foot">Nimiq Pay asks you to approve every payment. Your keys never leave your wallet.</p>
    ${!ps.done ? `<p class="foot"><a href="#" id="mk2" style="color:var(--muted)">Make your own pay link</a></p>` : ''}`;

  document.title = p.n + ' · Pay Links';
  paintProgress();
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on('#bk', () => { payload = null; try { history.replaceState(null, '', APP_URL); } catch {} go('receive'); });
  on('#mk', () => go('receive'));
  on('#mk2', e => { e.preventDefault(); go('receive'); });
  on('#ca', () => copy(p.a, 'Address copied'));
  on('#sa', () => { $('#sa').parentNode.textContent = 'Pays to ' + p.a; });
  on('#card', () => saveImage(makeCard(p, ps.done.amt), 'pay-links-tip.png'));
  on('#again', () => share(p.n, `Pay ${p.n} with Nimiq Pay`, payUrlFor(p)));
  if (ps.done) return;
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => { ps.amount = Number(c.dataset.a); $('#amt').value = ''; syncPay(); });
  if ($('#amt')) $('#amt').oninput = e => { const v = Number(String(e.target.value).replace(',', '.')); ps.amount = v > 0 && isFinite(v) ? v : null; syncPay(); };
  $('#pv2').onchange = e => { ps.priv = e.target.checked; if (ps.priv) { ps.msg = ''; $('#msg').value = ''; } $('#msg').disabled = ps.priv; syncPay(); };
  $('#msg').oninput = e => { ps.msg = e.target.value; syncPay(); };
  $('#go').onclick = doPay;
  syncPay();
}

function syncPay() {
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(Number(c.dataset.a) === ps.amount)));
  const bytes = byteLen(fullMsg()), tooLong = bytes > 64;
  const mh = $('#mh'); if (mh) { mh.textContent = tooLong ? 'That message is too long. Shorten it.' : 'Written on the blockchain, so anyone can read it.'; mh.style.color = tooLong ? 'var(--danger)' : ''; }
  const go = $('#go'); if (!go) return;
  go.disabled = Wallet.live && (ps.busy || !ps.amount || tooLong);
  go.textContent = !Wallet.live ? 'Open in Nimiq Pay to pay' : ps.busy ? 'Waiting for approval…' : ps.amount ? `Pay ${fmt(ps.amount)} NIM` : 'Choose an amount';
}

async function doPay() {
  if (!Wallet.live) { location.href = payUrlFor(payload); return; }
  if (!ps.amount || ps.busy) return;
  ps.busy = true; ps.error = ''; syncPay();
  try {
    let mine = []; try { mine = await Wallet.accounts(); } catch {}
    const to = validAddress(payload.a);
    if (mine.some(a => validAddress(a) === to)) throw Object.assign(new Error("You can't pay your own link. Share it with someone else."), { type: 'SELF' });
    try { const bal = mine[0] && await Wallet.balanceNim(mine[0]); if (bal != null && bal < ps.amount) throw Object.assign(new Error('You do not have enough NIM for this amount.'), { type: 'LOCAL' }); } catch (e) { if (e && e.type === 'LOCAL') throw e; }
    const hash = await Wallet.pay(payload.a, ps.amount, fullMsg());
    ps.done = { hash, amt: ps.amount };
    loadRaised();
  } catch (e) { ps.error = explain(e); }
  ps.busy = false; renderPay();
}

/* ---------- tabs, pay home, saved links ---------- */
let tab = 'receive';
function setTabs() { document.querySelectorAll('.tabs button').forEach(b => { if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); }); }
function go(t) { tab = t; if (t === 'receive') renderCreate(); else if (payload) renderPay(); else renderPayHome(); setTabs(); window.scrollTo(0, 0); }
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => go(b.dataset.tab));

const KEY = 'paylinks.mine';
const loadMine = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
function saveLink(p, url) {
  try { const l = loadMine().filter(x => x.url !== url); l.unshift({ n: p.n, t: p.t, url }); localStorage.setItem(KEY, JSON.stringify(l.slice(0, 20))); } catch {}
  paintMine();
}
function openUrl(url) { const m = /[?&#]d=([A-Za-z0-9_-]+)/.exec(url), p = m && dec(m[1]); if (p && p.v === 1 && validAddress(p.a) && p.n) { payload = p; resetPay(); go('pay'); return true; } return false; }
function paintMine() {
  const box = $('#mine-list'); if (!box) return;
  const l = loadMine(); box.hidden = !l.length; if (!l.length) return;
  box.innerHTML = '<h2>Your links</h2>' + l.map((x, i) => `<div class="mine"><div class="grow"><b>${esc(x.n)}</b><span>${esc((TYPES[x.t] || TYPES.person).label)}</span></div><button class="btn btn-ghost btn-sm" data-c="${i}">Copy</button><button class="btn btn-ghost btn-sm" data-o="${i}">Open</button></div>`).join('');
  box.querySelectorAll('[data-c]').forEach(b => b.onclick = () => copy(l[b.dataset.c].url, 'Link copied'));
  box.querySelectorAll('[data-o]').forEach(b => b.onclick = () => openUrl(l[b.dataset.o].url));
}
function payFromInput() {
  const v = $('#pl').value.trim(), a = validAddress(v), e = $('#pe');
  if (a) { payload = { v: 1, t: 'person', n: short(a.replace(/\s/g, '')), a, s: [10, 50, 100] }; resetPay(); go('pay'); return; }
  if (v && openUrl(v)) return;
  e.hidden = false; e.textContent = 'That is not a Pay Links link or a valid Nimiq address. Check it and try again.';
}
function renderPayHome() {
  $('#view').innerHTML = `
    <h1>Pay someone</h1>
    <p class="lead">Paste a pay link or a Nimiq address. Links you tap in chat open the pay page directly.</p>
    <section class="card">
      <label for="pl">Pay link or address</label>
      <input id="pl" placeholder="Paste here" autocomplete="off" autocapitalize="none" spellcheck="false">
      <p class="err" id="pe" role="alert" hidden></p>
      <div class="stack"><button class="btn btn-gold" id="pg">Continue</button></div>
    </section>`;
  const go1 = () => {
    const v = $('#pl').value.trim(), a = validAddress(v), e = $('#pe');
    if (a) { payload = { v: 1, t: 'person', n: short(a.replace(/\s/g, '')), a, s: [10, 50, 100] }; resetPay(); go('pay'); return; }
    if (v && openUrl(v)) return;
    e.hidden = false; e.textContent = 'That is not a Pay Links link or a valid Nimiq address. Check it and try again.';
  };
  $('#pg').onclick = go1; $('#pl').onkeydown = e => { if (e.key === 'Enter') go1(); };
}

/* ---------- boot ---------- */
(async function boot() {
  $('#view').innerHTML = '<p class="lead">Loading…</p>';
  await Wallet.init();
  const q = new URLSearchParams(location.search).get('d') || new URLSearchParams(location.hash.replace(/^#\/?/, '')).get('d');
  const p = q && dec(q);
  if (p && p.v === 1 && validAddress(p.a) && p.n) { payload = p; tab = 'pay'; resetPay(); renderPay(); }
  else { tab = 'receive'; renderCreate(); }
  setTabs();
})();

})();
</script>
</body>
</html>
