<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Pay Links for Nimiq Pay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F3F9; --surface:#FFFFFF; --text:#1F2348; --muted:#575D88; --line:#D8DBEC;
  --field:#F6F7FC; --gold:#F6B221; --ink:#1F2348; --danger:#B3261E; --ok:#17734A;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14173A; --surface:#1F2348; --text:#F3F4FB; --muted:#A6ACD3; --line:#343A6C;
         --field:#181B40; --danger:#FF9A92; --ok:#6BDBA2; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:500 16px/1.5 Mulish,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
.app{max-width:460px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;min-height:40px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
.pill{font-size:13px;font-weight:700;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}
.pill.live{color:var(--ok);border-color:var(--ok)}
h1{font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.01em;margin:22px 0 6px}
h2{font-size:18px;font-weight:800;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}
label,.lbl{display:block;font-weight:700;font-size:14px;margin:16px 0 6px}
label:first-child,.lbl:first-child{margin-top:0}
input,textarea{width:100%;background:var(--field);color:var(--text);border:1.5px solid var(--line);
  border-radius:12px;padding:12px 14px;font:inherit}
textarea{resize:vertical;min-height:64px}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.err{font-size:14px;color:var(--danger);margin:10px 0 0;font-weight:700}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--field);border:1.5px solid var(--line);border-radius:16px;padding:4px}
.seg button{border:0;background:transparent;color:var(--text);border-radius:12px;padding:10px 4px;font:700 14px Mulish,system-ui,sans-serif;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--gold);color:var(--ink)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 18px;font:800 16px Mulish,system-ui,sans-serif;cursor:pointer;text-align:center;text-decoration:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-gold{background:linear-gradient(180deg,#FFC93C,var(--gold));color:#1F2348}
.btn-ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn-sm{width:auto;padding:12px 16px;font-size:14px;white-space:nowrap}
.stack{display:grid;gap:10px;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--field);color:var(--text);border-radius:999px;padding:9px 16px;font:800 15px Mulish,system-ui,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.hero{display:flex;gap:14px;align-items:center}
.hero h1{margin:0;font-size:24px}
.tag{display:inline-block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:2px}
.addr{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);margin:14px 0 0;word-break:break-all}
.progress{height:10px;border-radius:99px;background:var(--field);border:1px solid var(--line);overflow:hidden;margin:8px 0 4px}
.progress i{display:block;height:100%;background:var(--gold);transition:width .4s}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-weight:700}
.notice{border:1.5px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted);margin-bottom:14px}
.linkbox{word-break:break-all;font-size:13px;background:var(--field);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;user-select:all}
.qr{display:flex;justify-content:center;margin-top:14px}
.qr div{background:#fff;padding:10px;border-radius:14px}
.done{text-align:center;padding:6px 0 2px}
.done h2{font-size:22px;margin-top:10px}
.done .hash{font-size:12px;color:var(--muted);word-break:break-all;margin-top:6px}
.pop{animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.pop{animation:none}.progress i{transition:none}}
.foot{font-size:13px;color:var(--muted);margin:18px 4px 0}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--text);color:var(--bg);font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;z-index:9}
.back{background:none;border:0;color:var(--muted);font:700 14px Mulish,system-ui,sans-serif;cursor:pointer;padding:8px 0}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span id="logo"></span>Pay Links</div>
    <span class="pill" id="mode">Preview</span>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

<script>
(() => {
'use strict';

/* ---------- config ---------- */
const LUNA = 100000;                                   // 1 NIM = 100,000 Luna
const DEMO_ADDR = 'NQ07 0000 0000 0000 0000 0000 0000 0000 0000';
const APP_URL = /^https?:/.test(location.protocol) ? location.origin + location.pathname : 'https://your-app.example/';
const GET_PAY_URL = 'https://nimpay.app';              // where non-users go to get Nimiq Pay
const TYPES = {
  person: { label: 'Person', blurb: 'Tips and support for someone', ph: 'Mara, docs translator' },
  bounty: { label: 'Bounty', blurb: 'One job, one payout', ph: 'Fix the forum FAQ' },
  pot:    { label: 'Group pot', blurb: 'Many people, one goal', ph: 'Meetup venue fund' },
};

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const short = a => a.slice(0, 9) + '…' + a.slice(-4);
const fmt = n => Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 });

// Nimiq addresses use the IBAN-style mod-97 checksum.
function validAddress(raw) {
  const a = String(raw).replace(/\s+/g, '').toUpperCase();
  if (!/^NQ\d{2}[0-9A-Z]{32}$/.test(a)) return null;
  let rem = 0;
  for (const ch of a.slice(4) + a.slice(0, 4)) {
    const v = /\d/.test(ch) ? ch : String(ch.charCodeAt(0) - 55);
    for (const d of v) rem = (rem * 10 + Number(d)) % 97;
  }
  return rem === 1 ? a.replace(/(.{4})/g, '$1 ').trim() : null;
}
const enc = o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const dec = s => { try { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return JSON.parse(decodeURIComponent(escape(atob(s)))); } catch { return null; } };
const parseAmounts = str => [...new Set(String(str).split(/[,\s]+/).map(Number).filter(n => n > 0 && isFinite(n)))].slice(0, 4);
const byteLen = s => new TextEncoder().encode(s).length;

let toastTimer;
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 1800);
}
async function copy(text, msg = 'Copied') {
  try { await navigator.clipboard.writeText(text); toast(msg); }
  catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast(msg); } catch { toast('Copy failed'); } ta.remove(); }
}
async function share(title, text, url) {
  if (navigator.share) { try { await navigator.share({ title, text, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  copy(url, 'Link copied');
}

/* ---------- hexagon avatar (Nimiq is hexagonal) ---------- */
let hexId = 0;
function hex(seed, size = 72) {
  let h = 7; for (const c of seed) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const h1 = h % 360, h2 = (h1 + 50 + (h >> 9) % 90) % 360, id = 'g' + (++hexId);
  const pts = (r, rot = 0) => [0,1,2,3,4,5].map(i => { const a = Math.PI / 3 * i - Math.PI / 2 + rot; return (50 + r * Math.cos(a)).toFixed(1) + ',' + (50 + r * Math.sin(a)).toFixed(1); }).join(' ');
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h1} 85% 58%)"/><stop offset="1" stop-color="hsl(${h2} 80% 48%)"/></linearGradient></defs>
    <polygon points="${pts(46)}" fill="url(#${id})" stroke-linejoin="round" stroke="url(#${id})" stroke-width="6"/>
    <polygon points="${pts(30, Math.PI / 6)}" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="3"/>
    <polygon points="${pts(13)}" fill="#fff" fill-opacity=".92"/></svg>`;
}
$('#logo').innerHTML = `<svg width="24" height="24" viewBox="0 0 100 100" aria-hidden="true"><polygon points="${[0,1,2,3,4,5].map(i => { const a = Math.PI/3*i - Math.PI/2; return (50+44*Math.cos(a)).toFixed(1)+','+(50+44*Math.sin(a)).toFixed(1); }).join(' ')}" fill="#F6B221" stroke="#F6B221" stroke-width="8" stroke-linejoin="round"/></svg>`;

/* ---------- wallet layer: Nimiq Pay provider, with a preview fallback ---------- */
const Wallet = {
  nimiq: null, live: false,
  async init() {
    try {
      const sdk = await import('https://esm.sh/@nimiq/mini-app-sdk');
      this.nimiq = await Promise.race([sdk.init(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 3000))]);
      this.live = true;
    } catch { this.live = false; }
    const m = $('#mode'); m.textContent = this.live ? 'Nimiq Pay' : 'Preview'; m.classList.toggle('live', this.live);
    return this.live;
  },
  async account() {
    if (!this.live) { await sleep(400); return DEMO_ADDR; }
    const [a] = await this.nimiq.listAccounts(); return a;
  },
  async balanceNim(addr) {
    if (this.live && typeof this.nimiq.getBalance === 'function') return (await this.nimiq.getBalance(addr)) / LUNA;
    return null;
  },
  async pay(recipient, nim, msg) {
    const value = Math.round(nim * LUNA);
    if (!this.live) { await sleep(1100); return Array.from({ length: 64 }, () => '0123456789abcdef'[Math.random() * 16 | 0]).join(''); }
    return msg ? this.nimiq.sendBasicTransactionWithData({ recipient, value, data: msg })
               : this.nimiq.sendBasicTransaction({ recipient, value });
  },
};
function explain(e) {
  const t = e && e.type;
  if (t === 'PERMISSION_DENIED') return 'Payment cancelled. Nothing was sent.';
  if (t === 'NETWORK_ERROR') return 'The network did not confirm the submission. Check your Nimiq Pay history before paying again.';
  if (t === 'INVALID_TRANSACTION' || t === 'INVALID_REQUEST') return 'Nimiq Pay rejected this payment: ' + ((e && e.message) || 'check the amount and address') + '.';
  return 'Payment failed: ' + ((e && e.message) || 'unknown error') + '.';
}

/* ---------- state ---------- */
let payload = null, preview = false;
let form = { t: 'person', n: '', d: '', a: '', g: '', s: '500, 1000, 5000' };
let ps = { amount: null, msg: '', busy: false, done: null, error: '' };
let demoRaised = 0, raised = null;

const linkFor = p => APP_URL + '?d=' + enc(p);
const payUrlFor = p => 'https://nimpay.app/miniapps/open/' + linkFor(p).replace(/^https?:\/\//, '');

function build() {
  const n = form.n.trim();
  if (!n) return { err: 'Name this link to see it here.' };
  const a = validAddress(form.a);
  if (!a) return { err: form.a.trim() ? 'That is not a valid Nimiq address. Check it and try again.' : 'Add the Nimiq address that receives the money.' };
  const s = parseAmounts(form.s), g = Number(form.g);
  const p = { v: 1, t: form.t, n, a };
  if (form.d.trim()) p.d = form.d.trim();
  if (form.t !== 'person' && g > 0) p.g = g;
  if (s.length) p.s = s;
  return { p };
}

/* ---------- create view ---------- */
function renderCreate() {
  const T = TYPES[form.t];
  $('#view').innerHTML = `
    <h1>Get paid by your community</h1>
    <p class="lead">Make a link for yourself, a bounty, or a group pot. Anyone with Nimiq Pay can pay it in two taps.</p>
    <section class="card">
      <div class="lbl">What is it for?</div>
      <div class="seg" role="group" aria-label="Link type">
        ${Object.entries(TYPES).map(([k, v]) => `<button type="button" data-t="${k}" aria-pressed="${k === form.t}">${v.label}</button>`).join('')}
      </div>
      <p class="hint">${T.blurb}.</p>
      <label for="n">Name</label>
      <input id="n" data-k="n" maxlength="60" placeholder="${esc(T.ph)}" value="${esc(form.n)}" autocomplete="off">
      <label for="d">What the money is for <span class="hint">(optional)</span></label>
      <textarea id="d" data-k="d" maxlength="200" placeholder="A sentence people will read before they pay">${esc(form.d)}</textarea>
      <label for="a">Nimiq address that gets paid</label>
      <div class="row">
        <input id="a" data-k="a" placeholder="NQ.. .... ...." value="${esc(form.a)}" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button type="button" class="btn btn-ghost btn-sm" id="mine">Use mine</button>
      </div>
      ${form.t !== 'person' ? `
      <label for="g">Goal in NIM <span class="hint">(optional)</span></label>
      <input id="g" data-k="g" inputmode="decimal" placeholder="e.g. 50000" value="${esc(form.g)}">
      <p class="hint">Progress is read from this address's balance, so use a fresh address for each ${form.t === 'pot' ? 'pot' : 'bounty'}.</p>` : ''}
      <label for="s">Quick amounts in NIM</label>
      <input id="s" data-k="s" inputmode="decimal" value="${esc(form.s)}" placeholder="500, 1000, 5000">
      <p class="hint">Up to four, separated by commas.</p>
    </section>
    <section class="card" id="out"></section>
    <p class="foot">Everything lives inside the link. No account, no server, nothing stored. Payments go straight from the payer's wallet to your address.</p>`;

  $('#view').querySelectorAll('[data-t]').forEach(b => b.onclick = () => { form.t = b.dataset.t; renderCreate(); });
  $('#view').querySelectorAll('[data-k]').forEach(i => i.oninput = () => { form[i.dataset.k] = i.value; updateOut(); });
  $('#mine').onclick = async () => {
    try { form.a = await Wallet.account(); $('#a').value = form.a; updateOut(); }
    catch (e) { toast(explain(e).replace('Payment ', 'Request ')); }
  };
  updateOut();
}

let qrLib;
function loadQR() {
  return qrLib || (qrLib = new Promise(res => {
    if (window.QRCode) return res(true);
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    s.onload = () => res(true); s.onerror = () => res(false); document.head.appendChild(s);
  }));
}

function updateOut() {
  const out = $('#out'); if (!out) return;
  const r = build();
  if (r.err) { out.innerHTML = `<h2>Your link</h2><p class="hint" style="margin:0">${esc(r.err)}</p>`; return; }
  const url = linkFor(r.p);
  out.innerHTML = `
    <h2>Your link is ready</h2>
    <p class="hint" style="margin:0 0 12px">Post it in the forum, Skool, Telegram or X.</p>
    <div class="linkbox" id="lb">${esc(url)}</div>
    <div class="stack">
      <button class="btn btn-gold" id="cp">Copy link</button>
      <button class="btn btn-ghost" id="sh">Share</button>
      <button class="btn btn-ghost" id="pv">See what payers see</button>
    </div>
    <div class="qr" id="qr" aria-label="QR code for this link"></div>`;
  $('#cp').onclick = () => copy(url, 'Link copied');
  $('#sh').onclick = () => share(r.p.n, `Pay ${r.p.n} with Nimiq Pay`, url);
  $('#pv').onclick = () => { payload = r.p; preview = true; resetPay(); renderPay(); window.scrollTo(0, 0); };
  loadQR().then(ok => {
    const box = $('#qr'); if (!ok || !box || !window.QRCode) return;
    box.innerHTML = '<div></div>';
    try { new QRCode(box.firstChild, { text: url, width: 176, height: 176, colorDark: '#1F2348', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); } catch { box.innerHTML = ''; }
  });
}

/* ---------- pay view ---------- */
function resetPay() { ps = { amount: payload.s && payload.s[0] || null, msg: '', busy: false, done: null, error: '' }; raised = null; loadRaised(); }

async function loadRaised() {
  if (!payload || !payload.g) return;
  try { raised = Wallet.live ? await Wallet.balanceNim(payload.a) : payload.g * 0.3 + demoRaised; } catch { raised = null; }
  paintProgress();
}
function paintProgress() {
  const el = $('#prog'); if (!el || !payload.g) return;
  if (raised == null) { el.innerHTML = `<div class="meta"><span>Goal ${fmt(payload.g)} NIM</span></div>`; return; }
  const pct = Math.min(100, raised / payload.g * 100);
  el.innerHTML = `<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><i style="width:${pct}%"></i></div>
    <div class="meta"><span>${fmt(raised)} NIM ${payload.t === 'bounty' ? 'funded' : 'raised'}</span><span>of ${fmt(payload.g)}</span></div>`;
}

function renderPay() {
  const p = payload, T = TYPES[p.t] || TYPES.person;
  const amounts = p.s || [];
  const body = ps.done ? `
    <div class="done">
      <div class="pop" style="display:inline-block">${hex(p.a, 84)}</div>
      <h2>${Wallet.live ? 'Sent' : 'Demo payment sent'}: ${fmt(ps.done.amt)} NIM</h2>
      <p class="hint" style="margin:4px 0 0">${Wallet.live ? `To ${esc(p.n)}. It confirms in a few seconds; check Nimiq Pay for the final status.` : 'Nothing moved. Open this link in Nimiq Pay to pay for real.'}</p>
      <div class="hash">${esc(ps.done.hash)}</div>
    </div>
    <div class="stack">
      <button class="btn btn-gold" id="again">Share this page</button>
      <button class="btn btn-ghost" id="mk">Make my own pay link</button>
    </div>` : `
    ${amounts.length ? `<div class="lbl">Amount in NIM</div><div class="chips" id="chips">${amounts.map(a => `<button type="button" class="chip" data-a="${a}" aria-pressed="${ps.amount === a}">${fmt(a)}</button>`).join('')}</div>` : ''}
    <label for="amt">${amounts.length ? 'Or enter another amount' : 'Amount in NIM'}</label>
    <input id="amt" inputmode="decimal" placeholder="0" value="${ps.amount && !amounts.includes(ps.amount) ? ps.amount : ''}">
    <label for="msg">Public message <span class="hint">(optional)</span></label>
    <input id="msg" maxlength="64" placeholder="Thanks for the help" value="${esc(ps.msg)}">
    <p class="hint" id="mh">Written on the blockchain, so anyone can read it.</p>
    ${ps.error ? `<p class="err" role="alert">${esc(ps.error)}</p>` : ''}
    <div class="stack"><button class="btn btn-gold" id="go"></button></div>`;

  $('#view').innerHTML = `
    ${preview ? `<button class="back" id="bk">Back to editing</button>` : ''}
    ${!Wallet.live ? `<div class="notice">You are viewing this outside Nimiq Pay, so payments here are a demo. <a href="${esc(payUrlFor(p))}" style="color:var(--text);font-weight:800">Open in Nimiq Pay</a> or <a href="${GET_PAY_URL}" style="color:var(--text);font-weight:800">get the app</a>.</div>` : ''}
    <section class="card">
      <div class="hero">${hex(p.a)}<div><span class="tag">${esc(T.label)}</span><h1>${esc(p.n)}</h1></div></div>
      ${p.d ? `<p style="margin:14px 0 0">${esc(p.d)}</p>` : ''}
      <div id="prog">${p.g ? '' : ''}</div>
      <p class="addr">Pays to ${esc(p.a)}</p>
    </section>
    <section class="card">${body}</section>
    <p class="foot">Nimiq Pay asks you to approve every payment. Your keys never leave your wallet.</p>
    ${!ps.done ? `<p class="foot"><a href="#" id="mk2" style="color:var(--muted)">Make your own pay link</a></p>` : ''}`;

  document.title = p.n + ' · Pay Links';
  paintProgress();
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on('#bk', () => { preview = false; renderCreate(); });
  on('#mk', () => { preview = false; payload = null; renderCreate(); });
  on('#mk2', e => { e.preventDefault(); preview = false; payload = null; history.replaceState(null, '', APP_URL); renderCreate(); });
  on('#again', () => share(p.n, `Pay ${p.n} with Nimiq Pay`, linkFor(p)));
  if (ps.done) return;
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => { ps.amount = Number(c.dataset.a); $('#amt').value = ''; syncPay(); });
  $('#amt').oninput = e => { const v = Number(String(e.target.value).replace(',', '.')); ps.amount = v > 0 && isFinite(v) ? v : null; syncPay(); };
  $('#msg').oninput = e => { ps.msg = e.target.value; syncPay(); };
  $('#go').onclick = doPay;
  syncPay();
}

function syncPay() {
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(Number(c.dataset.a) === ps.amount)));
  const bytes = byteLen(ps.msg), tooLong = bytes > 64;
  const mh = $('#mh'); if (mh) { mh.textContent = tooLong ? 'That message is too long. Shorten it.' : 'Written on the blockchain, so anyone can read it.'; mh.style.color = tooLong ? 'var(--danger)' : ''; }
  const go = $('#go'); if (!go) return;
  go.disabled = ps.busy || !ps.amount || tooLong;
  go.textContent = ps.busy ? 'Waiting for approval…' : ps.amount ? `${Wallet.live ? 'Pay' : 'Try demo payment of'} ${fmt(ps.amount)} NIM` : 'Choose an amount';
}

async function doPay() {
  if (!ps.amount || ps.busy) return;
  ps.busy = true; ps.error = ''; syncPay();
  try {
    const hash = await Wallet.pay(payload.a, ps.amount, ps.msg.trim());
    ps.done = { hash, amt: ps.amount };
    if (!Wallet.live) demoRaised += ps.amount; else loadRaised();
    if (!Wallet.live && payload.g) raised = payload.g * 0.3 + demoRaised;
  } catch (e) { ps.error = explain(e); }
  ps.busy = false; renderPay();
}

/* ---------- boot ---------- */
(async function boot() {
  $('#view').innerHTML = '<p class="lead">Loading…</p>';
  await Wallet.init();
  const q = new URLSearchParams(location.search).get('d') || new URLSearchParams(location.hash.replace(/^#\/?/, '')).get('d');
  const p = q && dec(q);
  if (p && p.v === 1 && validAddress(p.a) && p.n) { payload = p; resetPay(); renderPay(); }
  else renderCreate();
})();

})();
</script>
